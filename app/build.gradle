plugins { id 'com.android.application' }

android {
    namespace 'org.saraharchitect.offline'
    compileSdk 35
    defaultConfig {
        applicationId 'org.saraharchitect.offline'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1-m2-offline-host-candidate'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}
